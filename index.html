<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>학사일정</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <h1 id="ym"></h1>
        <button id="next" aria-label="다음 달">›</button>
      </div>

      <div class="toolbar">
        <span class="status" id="status"></span>
        <div class="btns">
          <div class="onoff-btn">
            <label class="onoff-label" for="perform">수행만 보기</label>
            <input type="checkbox" id="perform" />
            <label for="perform"></label>
          </div>
          <button class="btn" id="today">오늘</button>
        </div>
      </div>

      <div class="cal-area" id="calArea">
        <div class="cal-scroll">
          <table>
            <thead>
              <tr>
                <th class="sun">일</th>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
                <th>토</th>
              </tr>
            </thead>
            <tbody id="grid"></tbody>
          </table>
        </div>
        <div class="popup" id="popup" role="dialog" aria-live="polite">
          <button class="close" id="popClose" aria-label="닫기">✕</button>
          <div id="popBody"></div>
        </div>
      </div>
    </div>

    <div class="detail-wrap">
      <div class="detail">
        <h2>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="16" rx="1" />
            <path d="M3 10h18M8 3v4M16 3v4" />
          </svg>
          <span id="detailTitle"></span>
        </h2>
        <div id="detailList"></div>
      </div>
    </div>

    <script type="module" src="calsun.js"></script>
  </body>
</html>
